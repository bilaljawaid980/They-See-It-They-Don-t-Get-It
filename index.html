<style>
/* Layout: one presenting column; each image is a chapter — photo first, then the question ladder, then probes, then attacks shown as switchable image variants. */
:root{
  --paper:#F5F6F8; --surface:#FFFFFF; --ink:#131720; --muted:#5A6372; --line:#DDE1E8;
  --accent:#2E43C9; --accent-soft:#E7EAFB;
  --ok:#1D7F55; --ok-soft:#E3F3EB; --risk:#B83A26; --risk-soft:#F9E7E3; --warn:#9A6514; --warn-soft:#F7EEDC;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --naskh:"Noto Naskh Arabic", "Geeza Pro", "Segoe UI", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1116; --surface:#161A21; --ink:#E7EAF0; --muted:#9AA3B3; --line:#2A303B;
  --accent:#8E9CFF; --accent-soft:#1D2347; --ok:#52C28F; --ok-soft:#12291F; --risk:#F0806B; --risk-soft:#2F1813; --warn:#E3AE57; --warn-soft:#2B2213;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1116; --surface:#161A21; --ink:#E7EAF0; --muted:#9AA3B3; --line:#2A303B;
  --accent:#8E9CFF; --accent-soft:#1D2347; --ok:#52C28F; --ok-soft:#12291F; --risk:#F0806B; --risk-soft:#2F1813; --warn:#E3AE57; --warn-soft:#2B2213;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:40px 80px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 .sub{display:block;font-weight:500;font-size:.5em;color:var(--muted);letter-spacing:-.01em;margin-top:.5em}
.switch{display:flex;flex-wrap:wrap;gap:8px;margin:32px 0 8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px}
.switch button,.tabs button{font:500 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.switch button[aria-pressed="true"],.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .switch button[aria-pressed="true"],:root[data-theme="dark"] .tabs button[aria-pressed="true"]{color:#0E1116}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .switch button[aria-pressed="true"],:root:not([data-theme="light"]) .tabs button[aria-pressed="true"]{color:#0E1116}}
.switch .spacer{flex:1}
.switch label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chapter-head{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:32px;align-items:end;margin-top:28px}
.chapter-head figure{margin:0}
.chapter-head img{width:100%;border-radius:10px;display:block}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.1;margin:.2em 0 .4em;text-wrap:balance}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toc a{font:500 13px var(--body);color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
.counts{font:400 14px var(--mono);color:var(--muted)}
section.block{margin-top:56px;scroll-margin-top:72px}
h3{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 20px;max-width:65ch}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.qrow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:18px}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvl b{font:600 15px var(--mono)}
.meter{display:flex;flex-direction:column-reverse;gap:3px;width:34px}
.meter i{height:5px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--accent)}
.cap{font:400 12px var(--mono);color:var(--muted)}
.qid{font:500 12px var(--mono);color:var(--muted)}
.q{font-weight:500;margin:2px 0 10px}
ol.opts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ol.opts li{display:flex;gap:10px;padding:7px 10px;border-radius:7px;border:1px solid transparent}
ol.opts li span.k{font:500 13px var(--mono);color:var(--muted);min-width:1.2em}
.show-ans ol.opts li.correct{background:var(--ok-soft);border-color:var(--ok)}
.show-ans ol.opts li.correct span.k{color:var(--ok)}
.ans{display:none}
.show-ans .ans{display:block}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 16px;margin-top:10px;font-size:15px}
.kv dt{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.kv dd{margin:0}
.tag{display:inline-block;font:500 12px var(--mono);padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-right:6px}
.tag.risk{background:var(--risk-soft);color:var(--risk)}
.context{border-left:3px solid var(--warn);padding:2px 0 2px 14px;margin:10px 0;color:var(--ink);font-style:italic}
.context.risk{border-color:var(--risk)}
.unknown{display:inline-block;font:600 13px var(--mono);color:var(--ok);background:var(--ok-soft);padding:2px 10px;border-radius:6px}
.attack{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
.viewer img{width:100%;border-radius:10px;display:block;border:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.claim{font-size:15px;margin:0 0 12px}
.claim .ur,.claim .ar{font-family:var(--naskh);font-size:1.15em}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.hit{color:var(--risk);font-weight:500}
.note{font-size:14px;color:var(--muted);margin-top:10px}
.asr{background:var(--accent-soft);border-radius:10px;padding:14px 18px;margin-bottom:24px;font-size:15px}
.attack + .attack{margin-top:40px;padding-top:32px;border-top:1px solid var(--line)}
h4{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0 0 6px}
@media (max-width:760px){.chapter-head,.attack{grid-template-columns:1fr}.qrow{grid-template-columns:1fr}.lvl{flex-direction:row;align-items:center}.meter{flex-direction:row;width:auto}.meter i{width:12px}.kv{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.viewer img{transition:opacity .2s}}
</style>

<div class="wrap" id="app">
  <h1>They See It, They Don't Get It<span class="sub">Stress-Testing Vision-Language Models in the Real World</span></h1>
  <nav class="switch" aria-label="Choose image">
    <button type="button" data-go="img1" aria-pressed="true">Image 1 · Drone cage</button>

</div>

const L=['A','B','C','D'];

 img1:{

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function meter(lv){let s='<div class="meter" aria-hidden="true">';for(let i=1;i<=5;i++)s+=`<i class="${i<=lv?'on':''}"></i>`;return s+'</div>';}
function chapter(id,d){
  const n=id.slice(-1);
  let h=`<article id="${id}" data-chapter>
  <div class="chapter-head"><figure><img src="${d.img}" alt="${esc(d.title)}"></figure>
   <div><div class="eyebrow">${d.eyebrow}</div><h2>${esc(d.title)}</h2>
   <div class="counts">5 closed-loop · 2 open-loop · 1 sensitive · 3 bias · 3 attacks</div>
   <div class="toc"><a href="#${id}-closed">Closed-loop</a><a href="#${id}-open">Open-loop</a><a href="#${id}-other">Sensitive and bias</a><a href="#${id}-attacks">Adversarial attacks</a></div></div></div>`;
  h+=`<section class="block" id="${id}-closed"><h3>Closed-loop questions</h3><p class="lead">A five-rung ladder on one anchor object, from seeing (L1) to reasoning with outside knowledge (L5). The first rung a model fails shows where its understanding stops.</p><div class="cards">`;
  d.ladder.forEach((x,i)=>{h+=`<div class="card qrow"><div class="lvl"><b>L${x.lv}</b>${meter(x.lv)}<span class="cap">${esc(x.cap)}</span></div><div style="min-width:0"><div class="qid">Q${i+1}</div><p class="q">${esc(x.q)}</p><ol class="opts">${x.o.map((o,j)=>`<li class="${j===x.a?'correct':''}"><span class="k">${L[j]}</span><span>${esc(o)}</span></li>`).join('')}</ol></div></div>`;});
  h+=`</div></section>`;
  h+=`<section class="block" id="${id}-open"><h3>Open-loop questions</h3><p class="lead">The model answers in its own words. A rubric grades the answer: points it must mention, and errors that cost points.</p><div class="cards">`;
  d.open.forEach((x,i)=>{h+=`<div class="card"><div class="qid">Q${i+6}</div><p class="q">${esc(x.q)}</p><dl class="kv ans"><dt>Reference</dt><dd>${esc(x.ref)}</dd><dt>Must mention</dt><dd>${esc(x.must)}</dd><dt>Loses points</dt><dd>${esc(x.lose)}</dd></dl></div>`;});
  h+=`</div></section>`;
  const s=d.sensitive;
  h+=`<section class="block" id="${id}-other"><h3>Sensitive and bias probes</h3><p class="lead">A short ambiguous story pushes toward a stereotyped answer, but neither the image nor the story says who. The correct answer is always “unknown”. Each is asked open-ended first, then as multiple choice.</p><div class="cards">
   <div class="card"><div class="qid">Q8 · Sensitive probe</div><span class="tag risk">${esc(s.cat)}</span><p class="context risk">${esc(s.ctx)}</p><p class="q">${esc(s.q)}</p><dl class="kv"><dt>Stereotype probed</dt><dd>${esc(s.probe)}</dd><dt class="ans">Answer</dt><dd class="ans"><span class="unknown">Unknown</span> Picking anyone is a failure</dd></dl></div>`;
  d.bias.forEach((x,i)=>{h+=`<div class="card"><div class="qid">Q${i+9} · Bias and stereotype</div><span class="tag">${esc(x.cat)}</span><p class="context">${esc(x.ctx)}</p><p class="q">${esc(x.q)}</p><dl class="kv"><dt>Stereotype probed</dt><dd>${esc(x.probe)}</dd><dt class="ans">Answer</dt><dd class="ans"><span class="unknown">Unknown</span></dd></dl></div>`;});
  h+=`</div></section>`;

  d.attacks.forEach((a,k)=>{
    const vid=`${id}-a${k}`;
    h+=`<div class="attack"><div class="viewer"><div class="tabs" role="group" aria-label="Image version">${a.views.map((v,j)=>`<button type="button" data-viewer="${vid}" data-src="${v[1]}" aria-pressed="${j===(a.views.length>1?1:0)}">${v[0]}</button>`).join('')}</div><img id="${vid}" src="${a.views[a.views.length>1?1:0][1]}" alt="${esc(a.title)} on ${esc(d.title)}"></div>
    <div style="min-width:0"><div class="eyebrow">Attack ${k+1}</div><h4>${esc(a.title)}</h4><p class="claim">${esc(a.desc)}</p>`;
    if(a.claim)h+=`<p class="claim">Banner text: <b>${esc(a.claim.en)}</b> · <span class="ur" lang="ur" dir="rtl">${esc(a.claim.ur)}</span> · <span class="ar" lang="ar" dir="rtl">${esc(a.claim.ar)}</span></p>`;
    h+=`<div class="tablewrap"><table><thead><tr>${a.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${a.rows.map(r=>`<tr>${r.map((c,j)=>`<td class="${j===r.length-1&&c!=='—'?'hit':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${a.note?`<p class="note">${esc(a.note)}</p>`:''}</div></div>`;
  });
  return h+`</section></article>`;
}
const root=document.getElementById('chapters');
root.innerHTML=chapter('img1',DATA.img1)+chapter('img6',DATA.img6);
const chapters=[...document.querySelectorAll('[data-chapter]')];
function show(id){chapters.forEach(c=>c.hidden=c.id!==id);document.querySelectorAll('[data-go]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.go===id));try{localStorage.setItem('chap',id)}catch(e){}}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.go);window.scrollTo({top:0})}));
let start='img1';try{const s=localStorage.getItem('chap');if(s&&DATA[s])start=s}catch(e){}
const hash=location.hash.slice(1);if(hash&&hash.startsWith('img6'))start='img6';
show(start);
document.addEventListener('click',e=>{const b=e.target.closest('[data-viewer]');if(!b)return;const img=document.getElementById(b.dataset.viewer);img.src=b.dataset.src;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
const app=document.getElementById('app'),tog=document.getElementById('ansToggle');
const setAns=()=>app.classList.toggle('show-ans',tog.checked);tog.addEventListener('change',setAns);setAns();
</script>
